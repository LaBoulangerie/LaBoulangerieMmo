# =============================================================================
# RÉFÉRENCE DES ITEMS
# =============================================================================
# Chaque clé directement sous "items" est l'identifiant interne du loot.
#
# Item natif — toutes les clés disponibles :
# items:
#   exemple_natif:
#     provider: native                 # Obligatoire. Item construit par ce plugin.
#     material: DIAMOND                # Obligatoire. Nom d'un Material Paper.
#     name: "<#70B7E6>Nom affiché"     # Optionnel. Format MiniMessage, couleurs hexadécimales acceptées.
#     lore:                            # Optionnel. Une chaîne MiniMessage par ligne.
#       - "<#92A9B8>Première ligne"
#       - "<italic>Ligne volontairement italique"
#     custom-model-data: 12001         # Optionnel. Entier utilisé par le resource pack.
#     glint: true                      # Optionnel. true/false, force l'effet enchanté.
#     unbreakable: false               # Optionnel. true/false, false par défaut.
#     item-flags:                      # Optionnel. Valeurs de l'enum Paper ItemFlag.
#       - HIDE_ENCHANTS
#       - HIDE_UNBREAKABLE
#     enchantments:                    # Optionnel. Clé d'enchantement -> niveau.
#       sharpness: 3                   # Sans namespace, "minecraft" est utilisé.
#       "minecraft:unbreaking": 1
#     persistent-data:                 # Optionnel. Clé NamespacedKey -> valeur texte.
#       "monplugin:qualite": "rare"
#
# Item fourni par MythicMobs :
#   exemple_mythic:
#     provider: mythicmobs             # Le provider doit être disponible au chargement.
#     id: SkeletonEssence              # Obligatoire. Identifiant exact chez le provider.
#
# Item fourni par une extension :
#   exemple_externe:
#     provider: identifiant_provider   # Identifiant enregistré via l'API RareLootItemProvider.
#     id: identifiant_item             # Identifiant compris par ce provider.
#
# Le plugin ajoute automatiquement le PDC "laboulangeriemmo:rare_loot_id" aux
# items natifs. Une clé inconnue est ignorée par Bukkit ; utilisez uniquement les
# clés décrites ci-dessus.
# =============================================================================

