# =============================================================================
# RÉFÉRENCE D'UN FICHIER MÉTIER
# =============================================================================
# job: hunter                         # Obligatoire : identifiant exact du métier.
# rules:                              # Obligatoire : règles nommées librement.
#   exemple_complet:
#     enabled: false                  # Optionnel, true par défaut.
#     action: KILL                    # Obligatoire : voir les 5 actions ci-dessous.
#     conditions:                     # Optionnel : aucun filtre si absent.
#       block-types: [OAK_LOG]        # Materials source (actions de blocs).
#       block-tags: ["#minecraft:logs"] # Tags de blocs ; le # est optionnel.
#       entity-types: [SKELETON]      # EntityType Vanilla (KILL ou BREED).
#       mythic-mobs: [SkeletonKing]   # Noms internes MythicMobs.
#       tool-types: [DIAMOND_AXE]     # Materials tenus en main principale.
#       tool-tags: ["#minecraft:axes"] # Tags d'items ; le # est optionnel.
#       enchantments:                 # Enchantement requis -> niveau minimum.
#         sharpness: 2                # Namespace minecraft par défaut.
#       worlds: [world]               # Mondes autorisés.
#       excluded-worlds: [farm_world] # Mondes interdits, prioritaires.
#       biomes: [PLAINS]              # Biomes autorisés.
#       excluded-biomes: [DESERT]     # Biomes interdits, prioritaires.
#       permissions:                  # Le joueur doit posséder TOUTES les permissions.
#         - laboulangeriemmo.loot.example
#       spawn-reasons: [NATURAL]      # SpawnReason Paper (actions sur entités).
#       adult: true                   # true=adulte, false=bébé (KILL ou BREED).
#     loot:
#       item: reinforced_bone         # Identifiant déclaré dans items.yml.
#       amount: 1                     # Quantité fixe strictement positive.
#       # Variante : amount: { min: 1, max: 3 } (bornes incluses).
#       chance-profile: mastery_rare  # Profil déclaré dans chances.yml.
#       # Variantes remplaçant chance-profile :
#       # chance: 2.5                 # Pourcentage fixe entre 0 et 100.
#       # chance:
#       #   default: 0
#       #   levels: { 10: 1.0, 75: 5.0 }
#     anti-farm:                      # Surcharge optionnelle de settings.yml.
#       allow-creative: false
#       allow-placed-blocks: false
#       allow-spawner-mobs: false
#
# Actions : BLOCK_BREAK (bloc hors culture mûre), HARVEST (culture mûre),
# LOG_STRIP (écorçage réussi), KILL (mort attribuée au joueur), BREED (reproduction).
# Les valeurs d'une liste sont reliées par OU ; les familles de conditions par ET.
# block-types + block-tags forment un filtre OU, comme tool-types + tool-tags.
# Une condition non pertinente pour l'action empêche la règle de correspondre.
# Les règles correspondantes font chacune un tirage indépendant.
# =============================================================================

job: farmer

rules:
  solar_grain:
    enabled: true
    action: HARVEST
    conditions:
      block-types: [WHEAT, BEETROOTS]
    loot:
      item: solar_grain
      amount: 1
      chance:
        default: 0
        levels: { 3: 0.05, 28: 0.08, 64: 0.13, 90: 0.18 }

  royal_tuber:
    enabled: true
    action: HARVEST
    conditions:
      block-types: [CARROTS, POTATOES]
    loot:
      item: royal_tuber
      amount: 1
      chance:
        default: 0
        levels: { 19: 0.06, 46: 0.11, 79: 0.17 }

  aether_spore:
    enabled: true
    action: HARVEST
    conditions:
      block-types: [COCOA, NETHER_WART]
    loot:
      item: aether_spore
      amount: 1
      chance:
        default: 0
        levels: { 44: 0.10, 71: 0.18, 95: 0.28 }

  fertility_essence:
    enabled: true
    action: BREED
    conditions:
      entity-types: [COW, SHEEP, PIG, CHICKEN, GOAT, MOOSHROOM]
    loot:
      item: fertility_essence
      amount: 1
      chance:
        default: 0
        levels: { 76: 0.60, 88: 0.90, 100: 1.25 }
