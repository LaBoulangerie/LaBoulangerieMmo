trophy-rarities:
    common: 1.0
    uncommon: 0.5
    rare: 0.25
    epic: 0.1
    legendary: 0.05

# Optional handling for mobs registered by MythicMobs.
# Head modes: NONE, BASE or DISGUISE.
# Hunter XP values: AUTO (disguise type, then base type) or a non-negative amount.
mythicmobs:
    heads:
        default: NONE
        overrides: {}
        # Example: SkeletonKing: DISGUISE
    hunter-xp:
        default: AUTO
        overrides: {}
        # Example: SkeletonKing: 25.0

talent-tree:
    title: <talent> <player>
    # Placeholders: talent, level, xp
    talent-item:
        name: <bold><aqua><talent>
        lore:
            - <yellow>Niveau <aqua><level></aqua>
            - <yellow>XP <aqua><xp></aqua>
    # Placeholders: ability, tier, description, cooldown-value, cooldown-unit, required-level
    ability-item:
        name: <bold><yellow><ability>
        with-tier: <aqua> <tier>
        lore:
            - <gray><description>
            - <dark_gray><instruction>
            - ""
            - <yellow>Cooldown <aqua><cooldown-value> <cooldown-unit>
            - "<is-unlocked-color>[Niveau <required-level>]"
