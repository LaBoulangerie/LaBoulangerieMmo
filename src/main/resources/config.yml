locale: en_UK #Used to determine how numbers need to be formatted when displayed to players
# Log every MineLet terrain decision (can be noisy for area abilities).
minelet-protection-debug: false
# Two grinding XP gains are allowed from one position. The player must then move
# at least this many blocks in 3D before grinding XP can be earned again.
anti-afk-xp:
    minimum-distance: 1.0
lang:
    prefix: "<#FF8C42>[MMO] "
    bar:
        color: "GREEN"
        style: "PROGRESS"
        format: "<yellow><aqua><talent></aqua> lvl <level> | <aqua><xp></aqua>/<aqua><max_xp>xp</aqua>"
        delay: 200
    messages:
        ability_log: <yellow>You used <aqua><ability></aqua>, cooldown for <aqua><cooldown> <unit></aqua>
        level-up: <yellow>You reached level <aqua><level> <talent></aqua> !
        level-up-title: <bold><gradient:yellow:green>↑ LEVEL UP ↑
        level-up-subtitle: <aqua>Level <level> <talent>
        ability-unlocked: <yellow>Habilité <aqua><ability></aqua> débloquée !
        ability-upgrade: <yellow>Habilité <aqua><ability></aqua> améliorée au <aqua>Tier <tier></aqua> !
        xp_up: <yellow>+<aqua><xp>xp</aqua> as <talent>
        xp_up_boost: <bold><aqua> BOOST x<boost></aqua></bold>
        combo_toggle: <yellow>You <aqua><state></aqua> combos.
        ability-use-cooldown: <gold>You must wait <gray><duration> <unit></gray> before using <aqua><ability></aqua>.
        mastery-loot: <yellow>Vos yeux aguerris vous ont permis de trouver quelque chose !
    xp_boost:
        bar_title: "<aqua><bold>XP Boost x<boost></bold> <yellow>-</yellow> <talent> <yellow>-</yellow> <author> <yellow>-</yellow> <time></aqua>"
        notif: "<yellow><aqua><author></aqua> vient d'activer un boost <aqua><bold>x<boost></bold></aqua> pour le métier <aqua><talent></aqua> !"

    combo:
        delimiter: " - "
        empty: "<gray>?</gray>"
        # Names matching the ComboKey enum in lowercase.
        left: "<gold>L</gold>"
        right: "<gold>R</gold>"
        shift: "<gold>S</gold>"
#Whether or not to display a boss bar showing player's progression when gaining xp
enable-xp-bar: true
#Whether or not the talents should be enabled
enable-talents: true

redis:
    port: 6379
    # Delay before retrying Redis after a connection or command failure.
    retry-delay-seconds: 30

talents:
    miner:
        display_name: ⛏ Mineur
        abilities:
            fast-mine:
                display_name: Pioche Aiguisée
                display_item: GOLDEN_PICKAXE
                description: Accorde Célérité pour miner plus vite; puissance et durée augmentent avec le tier
                instruction: Combo G - D - G
                cooldown: 15
                unit: MINUTES
                level: 15
                effect: default
                log: false
                tiers:
                    - 15
                    - 45
                    - 75
                tier_descriptions:
                    - "Célérité II pendant 60 secondes"
                    - "Célérité III pendant 120 secondes"
                    - "Célérité IV pendant 300 secondes"
            fast-smelt:
                display_name: Cuisson Instantanée
                display_item: FURNACE
                description: Termine instantanément la cuisson en cours d'un haut fourneau contre un charbon
                instruction: Clique gauche sur un haut fourneau avec du charbon
                cooldown: 30
                unit: MINUTES
                level: 85
                effect: default
                log: true
            stone-skin:
                display_name: Peau de Pierre
                display_item: COBBLESTONE
                description: Accorde Résistance temporairement; puissance et durée augmentent avec le tier
                instruction: Combo G - G - D
                cooldown: 10
                unit: MINUTES
                level: 20
                effect: default
                log: true
                tiers:
                    - 20
                    - 45
                    - 70
                tier_descriptions:
                    - "Résistance I pendant 20 secondes"
                    - "Résistance I pendant 45 secondes"
                    - "Résistance II pendant 45 secondes"
            lucky-vein:
                display_name: Filon Chanceux
                display_item: DIAMOND
                description: Ajoute temporairement un bonus de Fortune aux minerais cassés
                instruction: Combo D - G - D
                cooldown: 15
                unit: MINUTES
                level: 50
                effect: default
                log: true
                tiers:
                    - 50
                    - 70
                    - 90
                tier_descriptions:
                    - "Bonus de Fortune +0,5 pendant 15 secondes"
                    - "Bonus de Fortune +0,75 pendant 30 secondes"
                    - "Bonus de Fortune +1 pendant 45 secondes"
        combo_items:
            - DIAMOND_PICKAXE
            - IRON_PICKAXE
            - STONE_PICKAXE
            - GOLDEN_PICKAXE
            - WOODEN_PICKAXE
            - NETHERITE_PICKAXE
    hunter:
        display_name: 🗡 Chasseur
        abilities:
            hunting-trophy:
                display_name: Trophée de Chasse
                display_item: SKELETON_SKULL
                description: Fonctionne sur certains mobs uniquement et jamais sur les joueurs
                instruction: Passif
                cooldown: 0
                unit: SECONDS
                level: 15
                effect: default
                log: false
                tiers:
                    - 15
                    - 40
                    - 70
                tier_descriptions:
                    - "1 % de chance de base sur certains mobs; joueurs exclus"
                    - "3 % de chance de base sur certains mobs; joueurs exclus"
                    - "5 % de chance de base sur certains mobs; joueurs exclus"
            exp-in-bottle:
                display_name: Mise en Bouteille
                display_item: EXPERIENCE_BOTTLE
                description: Transfère une partie de votre expérience Minecraft dans une bouteille échangeable
                instruction: Accroupi + clique droit avec une fiole vide
                cooldown: 0
                unit: SECONDS
                level: 5
                effect: default
                log: false
                tiers:
                    - 5
                    - 30
                    - 40
                tier_descriptions:
                    - "Place 100 points d'expérience dans une bouteille contre 1 lapis"
                    - "Place 200 points d'expérience dans une bouteille contre 1 lapis"
                    - "Place 300 points d'expérience dans une bouteille contre 1 lapis"
            fire-bow:
                display_name: Flèche Enflammée
                display_item: BOW
                description: Renforce la prochaine flèche enflammée et embrase sa zone d'impact
                instruction: Combo D - G - G puis tirer avec un arc enchanté Flamme
                cooldown: 15
                unit: MINUTES
                level: 15
                effect: default
                log: true
                tiers:
                    - 15
                    - 30
                    - 70
                tier_descriptions:
                    - "La prochaine flèche crée une zone de feu de 3 blocs autour de l'impact"
                    - "La prochaine flèche provoque une explosion incendiaire de puissance 2"
                    - "La prochaine flèche provoque une explosion incendiaire de puissance 3"
            hiding:
                display_name: Camouflage
                display_item: GLASS
                description: Vous camoufle temporairement; les tiers améliorent la durée et la discrétion
                instruction: Combo G - D - D
                cooldown: 25
                unit: MINUTES
                level: 50
                effect: default
                log: true
                tiers:
                    - 50
                    - 85
                    - 100
                tier_descriptions:
                    - "Invisibilité pendant 120 secondes; armure visible et particules présentes"
                    - "Invisibilité totale pendant 300 secondes; armure masquée mais particules présentes"
                    - "Invisibilité totale pendant 480 secondes; armure et particules masquées"
        combo_items:
            - DIAMOND_SWORD
            - IRON_SWORD
            - STONE_SWORD
            - GOLDEN_SWORD
            - WOODEN_SWORD
            - NETHERITE_SWORD
    farmer:
        display_name: ✂ Fermier
        abilities:
            nature-touch:
                display_name: Jeunes Pousses
                display_item: WHEAT_SEEDS
                description: Donne une chance de replanter automatiquement une culture mûre après récolte
                instruction: Passif
                cooldown: 0
                unit: MINUTES
                level: 5
                effect: default
                log: false
                tiers:
                    - 5
                    - 30
                    - 70
                tier_descriptions:
                    - "10 % de chance de replanter automatiquement la culture récoltée"
                    - "40 % de chance de replanter automatiquement la culture récoltée"
                    - "100 % de chance de replanter automatiquement la culture récoltée"
            better-bonemeal:
                display_name: Engrais Naturel
                display_item: BONE_MEAL
                description: Fait pousser les cultures autour du bloc ciblé dans un rayon amélioré par le tier
                instruction: Accroupi + clique droit avec de la poudre d'os
                cooldown: 15
                unit: MINUTES
                level: 15
                effect: default
                log: true
                tiers:
                    - 15
                    - 45
                    - 100
                tier_descriptions:
                    - "Applique une pousse aux cultures dans un rayon de 5 blocs"
                    - "Applique deux pousses aux cultures dans un rayon de 10 blocs"
                    - "Applique trois pousses aux cultures dans un rayon de 20 blocs"
            animal-twins:
                display_name: Jumeaux
                display_item: WHEAT
                description: Donne une chance de faire naître un second bébé lors d'une reproduction
                instruction: Passif
                cooldown: 1
                unit: SECONDS
                level: 20
                effect: default
                log: false
                tiers:
                    - 20
                    - 55
                    - 80
                tier_descriptions:
                    - "10 % de chance de faire naître un second bébé"
                    - "20 % de chance de faire naître un second bébé"
                    - "35 % de chance de faire naître un second bébé"
            tasty-bread:
                display_name: Pain Aléchant
                display_item: BREAD
                description: Attire avec du pain les animaux proches; portée et espèces augmentent avec le tier
                instruction: Passif
                cooldown: 1
                unit: SECONDS
                level: 10
                effect: default
                log: false
                tiers:
                    - 10
                    - 60
                tier_descriptions:
                    - "Attire vaches, cochons, poules et moutons dans un rayon de 10 blocs"
                    - "Attire les animaux reproductibles et aquatiques dans un rayon de 20 blocs"
        combo_items:
            - DIAMOND_HOE
            - IRON_HOE
            - STONE_HOE
            - GOLDEN_HOE
            - WOODEN_HOE
            - NETHERITE_HOE
    lumberjack:
        display_name: 🪓 Bûcheron
        abilities:
            double-drop-log:
                display_name: Grosses Bûches
                display_item: OAK_LOG
                description: Donne une chance d'obtenir une bûche ou une pomme supplémentaire à la récolte
                instruction: Passif
                cooldown: 0
                unit: SECONDS
                level: 5
                effect: default
                log: false
                tiers:
                    - 5
                    - 40
                    - 75
                tier_descriptions:
                    - "10 % de chance d'obtenir une bûche ou une pomme supplémentaire"
                    - "20 % de chance d'obtenir une bûche ou une pomme supplémentaire"
                    - "35 % de chance d'obtenir une bûche ou une pomme supplémentaire"
            timber:
                display_name: Timber
                display_item: GOLDEN_AXE
                description: Abat les bûches directement reliées au bloc cassé et récupère leurs ressources
                instruction: Combo G - G - D
                cooldown: 5
                unit: MINUTES
                level: 35
                effect: default
                log: true
                tiers:
                    - 35
                    - 65
                    - 95
                tier_descriptions:
                    - "Abat les bûches connectées de même type dans un rayon horizontal de 3 blocs"
                    - "Abat les bûches connectées de même type dans un rayon horizontal de 5 blocs"
                    - "Abat les bûches connectées de même type dans un rayon horizontal de 7 blocs"
            stun:
                display_name: Étourdissement
                display_item: NETHER_STAR
                description: Les coups critiques à la hache peuvent ralentir et aveugler temporairement la cible
                instruction: Passif
                cooldown: 10
                unit: SECONDS
                level: 20
                effect: default
                log: false
                tiers:
                    - 20
                    - 50
                    - 85
                tier_descriptions:
                    - "5 % de chance de ralentir la cible au niveau II pendant 2 secondes"
                    - "10 % de chance de ralentir III et aveugler pendant 3 secondes"
                    - "20 % de chance de ralentir IV et aveugler pendant 5 secondes"
            nature-shelter:
                display_name: Abri Naturel
                display_item: OAK_LEAVES
                description: Régénère périodiquement vie puis nourriture lorsque vous êtes abrité sous des feuilles
                instruction: Passif
                cooldown: 0
                unit: SECONDS
                level: 10
                effect: default
                log: false
                tiers:
                    - 10
                    - 35
                    - 65
                tier_descriptions:
                    - "Sous des feuilles, restaure 1 point de vie toutes les 2,5 secondes"
                    - "Restaure 1,5 point de vie et 1 point de nourriture toutes les 2,5 secondes"
                    - "Restaure 2 points de vie et 1 point de nourriture toutes les 2,5 secondes"
        combo_items:
            - DIAMOND_AXE
            - IRON_AXE
            - STONE_AXE
            - GOLDEN_AXE
            - WOODEN_AXE
            - NETHERITE_AXE

